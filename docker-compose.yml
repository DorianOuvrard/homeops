services:
  odoo:
    image: odoo:17.0
    container_name: homeops-odoo
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
    entrypoint: ["/bin/sh", "-c", "sed 's/$${ODOO_MASTER_PASSWORD}/'\"$$ODOO_MASTER_PASSWORD\"'/' /etc/odoo/odoo.conf.tpl > /etc/odoo/odoo.conf && exec /entrypoint.sh odoo"]
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons
      - ./odoo.conf.tpl:/etc/odoo/odoo.conf.tpl:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: homeops-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  odoo-data:
  pg-data:
  odoo-addons:
